name: Tests Playwright - Inscription Campus France

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environnement:
        description: 'Environnement à tester'
        type: choice
        options: [qa, pp, prod]
        default: qa

# Variables d'environnement (équivalent du fichier .env, qui n'est pas envoyé sur GitHub)
env:
  ENV: ${{ inputs.environnement || 'qa' }}
  URL_QA: https://www.campusfrance.org
  URL_PP: https://www.campusfrance.org
  URL_PROD: https://www.campusfrance.org

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests (environnement ${{ env.ENV }})
        run: npx playwright test

      - name: Publier les fichiers de sortie
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: resultats-${{ env.ENV }}
          path: output/
          retention-days: 30
